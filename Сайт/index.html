<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  
  <link rel="stylesheet" href="style.css">
  <title>Калькулятор стоимости мобильной связи</title>
</head>
<body>
  <form id="calculatorForm" class="section__form">
    <div class="container-xl">
      <h1 style="text-align: center;">Калькулятор стоимости мобильной связи</h1>
      <div class="mb-3">
        <label for="minutes" class="form-label">Количество минут разговора в месяц</label>
        <input type="number" id="minutes" name="minutes" required class="form-control">
      </div>
      <div class="mb-3">
        <label for="sms" class="form-label">Количество SMS в месяц</label>
        <input type="number" id="sms" name="sms" required class="form-control">
      </div>
      <div class="mb-3">
        <label for="data" class="form-label">Объем интернет-трафика в ГБ</label>
        <input type="number" id="data" name="data" step="0.1" required class="form-control">
      </div>
      <div class="mb-3">
        <label for="operator" class="form-label">Выберите оператора связи</label>
        <select class="form-select" id="operator" name="operator">
          <option value="МТС">МТС</option>
          <option value="ТЕЛЕ2">Теле2</option>
          <option value="БИЛАЙН">Билайн</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="tariff" class="form-label">Выберите тарифный план</label>
        <select class="form-select" id="tariff" name="tariff">
          <option value="Базовый">Базовый</option>
          <option value="Безлимитный">Безлимитный</option>
        </select>
      </div>
      <button type="submit" class="btn btn-info">Расчет</button>
    </div>
    <div id="result" class="mt-3"></div>
  </form>
  <script src="script.js"></script>
</body>
</html>
